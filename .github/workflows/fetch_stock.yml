name: Fetch Stock Data

permissions:
  contents: write

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 週一到週五 UTC 13:00 (台灣時間 21:00)
  workflow_dispatch:  # 也允許手動觸發,方便測試

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python fetch_stock_tsmc/fetch_stock_tsmc.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Update stock data" || echo "No changes"
          git push
