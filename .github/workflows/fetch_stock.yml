name: Fetch Stock Data

permissions:
  contents: write

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 週一到週五 UTC 07:00 (台灣時間 15:00)
  workflow_dispatch:  # 也允許手動觸發,方便測試

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas requests
      - run: python fetch_stock_tsmc.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stock-data/
          git commit -m "Update stock data" || echo "No changes"
          git push

      - name: Send notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_USER_ID: ${{secrets.LINE_USER_ID}}
          LINE_CHANNEL_ACCESS_TOKEN: ${{secrets.LINE_CHANNEL_ACCESS_TOKEN}}
        run: python notify/notify.py
